name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: bundle checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Without `--profile` these are the self-contained checks: the package's
      # own consistency, the client bundle executed against a module-loader stub,
      # a host-half smoke run, and the configuration routes driven over real HTTP.
      - name: Bundle self-consistency
        run: node tools/preflight.mjs
